<text x="480" y="348" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="700">Span 64KB alinhado — metadado por MASCARA do ponteiro (zero header/objeto)</text>
<text x="300" y="372" font-size="10.5" text-anchor="middle" fill="#64748b" font-weight="400">free-list local: so o dono, sem atomico</text>
<text x="662" y="372" font-size="10.5" text-anchor="middle" fill="#64748b" font-weight="400">remote_free: push atomico Treiber (cross-thread)</text>
<line x1="480.0" y1="296.0" x2="480.0" y2="326.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="120" y="424" width="340" height="54" rx="9" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
<text x="290.0" y="448.0" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Cache de chunks 64KB (2 niveis)</text>
<text x="290.0" y="465.0" font-size="10.5" text-anchor="middle" fill="#64748b">por-thread sem lock + global</text>
<rect x="540" y="424" width="300" height="54" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="690.0" y="448.0" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Segmentos 4MB do SO</text>
<text x="690.0" y="465.0" font-size="10.5" text-anchor="middle" fill="#64748b">VirtualAlloc / mmap</text>
