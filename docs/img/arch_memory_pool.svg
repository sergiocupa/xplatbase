<line x1="500.0" y1="122.0" x2="650.0" y2="158.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="120" y="236" width="720" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="480" y="258" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="700">Heap por-thread (TLS) — listas de spans por classe</text>
<text x="480" y="278" font-size="10.5" text-anchor="middle" fill="#64748b" font-weight="400">spans[classe]: AVAILABLE   |   full list: FULL (nunca varrido no alloc)</text>
