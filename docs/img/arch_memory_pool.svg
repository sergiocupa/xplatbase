<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#475569"/></marker><marker id="ahd" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#94a3b8"/></marker></defs>
<rect x="2" y="2" width="916" height="556" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="26" y="34" font-size="20" font-weight="700" fill="#0f172a">Memory Pool — alocador por size-class (estilo mimalloc/rpmalloc)</text>
<text x="26" y="55" font-size="12.5" fill="#64748b">heap por-thread (TLS) · span 64KB achado por mascara · cache de chunks 2 niveis</text>
<rect x="330" y="74" width="260" height="48" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="460.0" y="95.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">memop_alloc_raw(size)</text>
<text x="460.0" y="112.0" font-size="10.5" text-anchor="middle" fill="#64748b">hot path: void* em registrador</text>
<rect x="120" y="158" width="300" height="48" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="270.0" y="179.0" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">size -&gt; classe (tabela O(1))</text>
<text x="270.0" y="196.0" font-size="10.5" text-anchor="middle" fill="#64748b">36 classes, passo ~25%, &lt;= 16KB</text>
<rect x="540" y="158" width="300" height="48" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="690.0" y="179.0" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">LARGE (&gt; 16KB)</text>
<text x="690.0" y="196.0" font-size="10.5" text-anchor="middle" fill="#64748b">passthrough malloc (pendencia)</text>
