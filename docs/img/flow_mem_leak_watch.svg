<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#475569"/></marker><marker id="ahd" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#94a3b8"/></marker></defs>
<rect x="2" y="2" width="916" height="466" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="26" y="34" font-size="20" font-weight="700" fill="#0f172a">Mem Leak Watch — alcancabilidade estilo GC, sem coletar</text>
<text x="26" y="55" font-size="12.5" fill="#64748b">check barato no timer · scan caro so quando a RAM cruza o limiar · NUNCA libera</text>
<rect x="40" y="86" width="150" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="115.0" y="109.0" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Timer</text>
<text x="115.0" y="126.0" font-size="10.5" text-anchor="middle" fill="#64748b">interval_ms</text>
<rect x="230" y="86" width="210" height="52" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="335.0" y="109.0" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">check barato</text>
<text x="335.0" y="126.0" font-size="10.5" text-anchor="middle" fill="#64748b">le memop_get_stats()</text>
<rect x="490" y="84" width="170" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="575.0" y="117.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">RAM &gt; limiar?</text>
<rect x="720" y="84" width="160" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="800.0" y="117.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">scan caro</text>
<line x1="190.0" y1="112.0" x2="230.0" y2="112.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="440.0" y1="112.0" x2="490.0" y2="112.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="660.0" y1="113.0" x2="720.0" y2="113.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="690" y="105" font-size="10" text-anchor="middle" fill="#64748b" font-weight="600">sim</text>
<path d="M540.0,142.0 Q450.0,108.0 360.0,138.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ahd)"/>
<text x="455" y="178" font-size="10.5" text-anchor="middle" fill="#64748b" font-weight="600">nao</text>
<text x="300" y="196" font-size="10.5" text-anchor="middle" fill="#64748b" font-weight="400">loop barato: roda com frequencia alta, sem suspender nenhuma thread</text>
<path d="M800.0,142.0 L800.0,232.0 L135.0,232.0 L135.0,270.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="468" y="224" font-size="10.5" text-anchor="middle" fill="#64748b" font-weight="400">para cada thread registrada, uma de cada vez (thread_enum)</text>
<rect x="40" y="270" width="190" height="58" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="135.0" y="296.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">suspende 1 thread</text>
<text x="135.0" y="313.0" font-size="10.5" text-anchor="middle" fill="#64748b">SuspendThread</text>
<rect x="270" y="270" width="220" height="58" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="296.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">le registradores + pilha</text>
<text x="380.0" y="313.0" font-size="10.5" text-anchor="middle" fill="#64748b">= raizes (conservador)</text>
<rect x="530" y="270" width="175" height="58" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="617.5" y="296.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">marca spans alcancados</text>
<text x="617.5" y="313.0" font-size="10.5" text-anchor="middle" fill="#64748b">por span inteiro</text>
<rect x="745" y="270" width="135" height="58" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="812.5" y="296.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">retoma thread</text>
<text x="812.5" y="313.0" font-size="10.5" text-anchor="middle" fill="#64748b">ResumeThread</text>
<line x1="230.0" y1="299.0" x2="270.0" y2="299.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="490.0" y1="299.0" x2="530.0" y2="299.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="705.0" y1="299.0" x2="745.0" y2="299.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="270" y="378" width="380" height="44" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="460.0" y="397.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">reporta nao-alcancados -&gt; log (WARN / CRITICAL)</text>
<text x="460.0" y="414.0" font-size="10.5" text-anchor="middle" fill="#64748b">com mini-backtrace do span_create</text>
<line x1="617.0" y1="328.0" x2="560.0" y2="378.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="700" y="404" font-size="11.5" text-anchor="start" fill="#dc2626" font-weight="700">nunca libera</text>
</svg>